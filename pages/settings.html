<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Settings · InvSync</title>

  <meta name="description" content="Store profile, tax, currency, channel integrations and preferences." />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/img/favicon.svg" />
  <meta name="theme-color" content="#4f46e5" />

  <script>
    if (localStorage.getItem('invsync.theme') === 'dark' ||
        (!localStorage.getItem('invsync.theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <link rel="stylesheet" href="/assets/css/tailwind.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body data-page="settings" class="bg-surface-base text-[var(--text-primary)] font-sans antialiased">
  <a href="#main-content" class="skip-link">Skip to main content</a>


  <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-30 lg:hidden"></div>

  <aside id="sidebar"
    class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out border-r"
    style="border-color: var(--border-subtle); background: var(--surface-raised);">
    <div id="sidebar-mount" class="h-full"></div>
  </aside>

  <div class="lg:pl-64 min-h-screen flex flex-col">
    <div id="topbar-mount"></div>

    <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 route-enter space-y-6">
      <div>
        <h1 class="font-display text-2xl font-bold">Settings</h1>
        <p class="text-sm text-[var(--text-secondary)] mt-1">Store profile, tax, currency, channel integrations and preferences.</p>
      </div>

      <div class="card p-4">
        <div id="settings-tabs">
          <div class="tabs-list flex-wrap gap-1">
            <button class="tab-btn active" data-tab="profile" type="button">Store Profile</button>
            <button class="tab-btn" data-tab="tax" type="button">Tax &amp; Currency</button>
            <button class="tab-btn" data-tab="integrations" type="button">Integrations</button>
            <button class="tab-btn" data-tab="preferences" type="button">Preferences</button>
            <button class="tab-btn" data-tab="data" type="button">Data</button>
          </div>

          <div data-tab-panel="profile" class="pt-5">
            <div id="store-profile-form"></div>
          </div>

          <div data-tab-panel="tax" class="hidden pt-5">
            <div id="tax-currency-form"></div>
          </div>

          <div data-tab-panel="integrations" class="hidden pt-5 space-y-3">
            <p class="text-sm text-[var(--text-secondary)]">Connect your online store and payment providers. Each one needs an account of your own and its keys.</p>
            <div id="integrations-list" class="space-y-2"></div>
          </div>

          <div data-tab-panel="preferences" class="hidden pt-5">
            <div id="preferences-form"></div>
          </div>

          <div data-tab-panel="data" class="hidden pt-5">
            <div id="data-form"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-root"></div>

  <script type="module">
    import { bootstrapApp } from '/assets/js/app.js';
    import { initSettingsPage } from '/assets/js/pages/settings.page.js';

    await bootstrapApp();
    await initSettingsPage();
  </script>
</body>
</html>
