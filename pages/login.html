<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in · InvSync</title>

  <meta name="description" content="Sign in to InvSync — unified inventory management for your shop and online store." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/img/favicon.svg" />
  <meta name="theme-color" content="#4f46e5" />

  <script>
    if (localStorage.getItem('invsync.theme') === 'dark' ||
        (!localStorage.getItem('invsync.theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <link rel="stylesheet" href="/assets/css/tailwind.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />

  <style>
    .auth-bg {
      background:
        radial-gradient(60rem 30rem at 15% -10%, color-mix(in srgb, var(--color-primary-500) 14%, transparent), transparent 60%),
        radial-gradient(50rem 26rem at 105% 110%, color-mix(in srgb, var(--color-primary-400) 12%, transparent), transparent 60%),
        var(--surface-base);
    }
    .auth-mark { background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700)); box-shadow: var(--shadow-lg); }
    .pw-toggle { position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%); width: 2.5rem; height: 2.5rem; display: grid; place-items: center; color: var(--text-muted); border-radius: var(--radius-md); }
    .pw-toggle:hover { color: var(--text-primary); }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="auth-ready auth-bg text-[var(--text-primary)] font-sans antialiased">
  <a href="#auth-form" class="skip-link">Skip to sign-in form</a>

  <main class="min-h-screen grid place-items-center p-4 sm:p-6" style="padding-bottom: max(1rem, env(safe-area-inset-bottom));">
    <div class="w-full max-w-md route-enter">
      <div class="text-center mb-6">
        <span class="auth-mark inline-grid place-items-center w-14 h-14 rounded-2xl">
          <i class="fa-solid fa-cubes text-white text-xl" aria-hidden="true"></i>
        </span>
        <p data-brand-name class="font-display text-2xl font-bold mt-3">InvSync</p>
        <p class="text-sm text-[var(--text-secondary)]">Unified Inventory Management</p>
      </div>

      <div class="card p-6 sm:p-8">
        <h1 id="auth-title" class="font-display text-xl font-bold">Welcome back</h1>
        <p id="auth-subtitle" class="text-sm text-[var(--text-secondary)] mt-1">Sign in to manage your shop.</p>

        <div id="auth-alert" class="alert mt-5" role="alert" hidden></div>

        <form id="auth-form" class="mt-5 space-y-4" novalidate>
          <div data-modes="signup" hidden>
            <label class="field-label" for="f-name">Full name</label>
            <input id="f-name" class="input" type="text" autocomplete="name" placeholder="e.g. Ama Boateng" />
          </div>

          <div data-modes="signup shop" hidden>
            <label class="field-label" for="f-shop">Shop name</label>
            <input id="f-shop" class="input" type="text" autocomplete="organization" maxlength="80" placeholder="e.g. Ama's Boutique" />
            <p class="field-hint" id="f-shop-hint">This creates your own shop, with its own products, sales and staff. Leave it empty if the shop owner is adding you to their shop.</p>
          </div>

          <div data-modes="signin signup forgot">
            <label class="field-label" for="f-email">Email</label>
            <input id="f-email" class="input" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" />
          </div>

          <div data-modes="signin signup recover">
            <div class="flex items-center justify-between">
              <label class="field-label" for="f-password" id="f-password-label">Password</label>
              <button type="button" id="forgot-link" class="text-xs font-semibold text-primary-600 hover:underline mb-1.5" data-modes="signin">Forgot password?</button>
            </div>
            <div class="relative">
              <input id="f-password" class="input pr-11" type="password" autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="pw-toggle" data-toggle-password aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
            </div>
            <p id="pw-hint" class="field-hint" hidden>Use at least 8 characters.</p>
          </div>

          <div data-modes="recover" hidden>
            <label class="field-label" for="f-confirm">Confirm new password</label>
            <input id="f-confirm" class="input" type="password" autocomplete="new-password" placeholder="••••••••" />
          </div>

          <button id="auth-submit" type="submit" class="btn btn-primary w-full btn-lg" data-modes="signin signup forgot recover shop">
            <span id="auth-submit-label">Sign in</span>
          </button>
        </form>

        <!-- Shown instead of the form when someone is signed in but can't use the app yet (mode "verify"). -->
        <div id="auth-panel" class="mt-5 space-y-3" hidden>
          <p id="auth-panel-text" class="text-sm text-[var(--text-secondary)]"></p>
          <button id="panel-primary" type="button" class="btn btn-primary w-full btn-lg"></button>
          <button id="panel-secondary" type="button" class="btn btn-secondary w-full"></button>
          <button id="panel-signout" type="button" class="btn btn-ghost w-full"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sign out</button>
        </div>
      </div>

      <p class="text-center text-sm text-[var(--text-secondary)] mt-5" id="auth-switch"></p>
    </div>
  </main>

  <div id="toast-root"></div>

  <script type="module">
    import { initLoginPage } from '/assets/js/pages/login.page.js';
    initLoginPage();
  </script>
</body>
</html>
